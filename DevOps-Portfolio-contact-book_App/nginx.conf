events { 
    # Maximum number of simultaneous connections that each worker process can handle
    worker_connections 1024;
}
http {
    # Include file extension mapping to standard MIME types
    include /etc/nginx/mime.types; 
    # Fallback default type for files with unknown extensions
    default_type application/octet-stream;
    # ==========================================
    # Gzip Compression Settings
    # ==========================================
    # Enable Gzip compression to reduce network payload and improve page load speed
    gzip on; 
    # MIME types allowed for compression (avoid compressing already zipped formats like images)
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript; 
    # Minimum file size (in bytes) to trigger compression; skips tiny files to save CPU usage
    gzip_min_length 256; 
    # Compression level from 1 (fastest, lowest compression) to 9 (slowest, highest compression)
    gzip_comp_level 5;
    # Instructs proxies to cache both gzipped and non-gzipped versions of assets
    gzip_vary on;
    server {
        # Listen on standard HTTP port 80
        listen 80;
        # ==========================================
        # Security Headers
        # ==========================================
        # Prevent Clickjacking attacks by disallowing embedding inside iframes on external sites
        add_header X-Frame-Options "SAMEORIGIN" always;  
        # Prevent MIME-type sniffing (forces browsers to strictly follow the content-type header)
        add_header X-Content-Type-Options "nosniff" always;
        # Enable built-in browser Cross-Site Scripting (XSS) filtering and block rendering if an attack is detected
        add_header X-XSS-Protection "1; mode=block" always;       
        # Control how much referrer information (URL metadata) is sent when navigating away from your site
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # ==========================================
        # Reverse Proxy Routing
        # ==========================================
        location / {
            # Forward incoming requests to the internal Flask application container running on port 5000
            proxy_pass http://app:5000/;           
            # Pass the original host header from the client to the backend application
            proxy_set_header Host $host;            
            # Pass the real IP address of the client to the backend (instead of Nginx's internal IP)
            proxy_set_header X-Real-IP $remote_addr;          
            # Append real client IP to the chain of proxy IPs
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;           
            # Forward the request protocol (HTTP or HTTPS) to the backend
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}