apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: contact-book
  namespace: argocd

spec:
  project: default

  source:
    repoURL: "git@github.com:shakeddukeman25/DevOps-Portfolio-Cluster_Resources.git"
    targetRevision: main
    path: applications/contact-book

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true