apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: mongodb-secret
  namespace: default

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: mongodb-secret
    creationPolicy: Owner

    template:
      engineVersion: v2

      data:
        MONGO_USERNAME: "app_user"
        MONGO_PASSWORD: "{{ .password }}"

        MONGO_HOST: "mongodb-headless.mongodb.svc.cluster.local"
        MONGO_PORT: "27017"
        MONGO_DB: "contact_book_db"

        MONGO_URI: "mongodb://app_user:{{ .password }}@mongodb-headless.mongodb.svc.cluster.local:27017/contact_book_db?authSource=contact_book_db&replicaSet=rs0"

  data:
    - secretKey: password
      remoteRef:
        key: contact-book/mongodb
        property: mongodb-passwords